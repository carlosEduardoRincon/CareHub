version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: carehub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carehub}
      POSTGRES_USER: ${POSTGRES_USER:-<usuario-db>}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-<senha-db>}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: carehub-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4LrtYg9tSUG-6yHhX9F1Hw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  notification:
    build:
      context: .
      dockerfile: Notification/Dockerfile
      args:
        JAVA_VERSION: "21"
    image: carehub-notification:latest
    container_name: carehub-notification
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-carehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-<usuario-db>}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-<senha-db>}
      SERVER_PORT: "8081"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - backend

  scheduling:
    build:
      context: .
      dockerfile: Scheduling/Dockerfile
      args:
        JAVA_VERSION: "21"
    image: carehub-scheduling:latest
    container_name: carehub-scheduling
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-carehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-<usuario-db>}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-<senha-db>}
      SERVER_PORT: "8082"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - backend

volumes:
  db-data:

networks:
  backend:
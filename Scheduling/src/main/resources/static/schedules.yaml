openapi: 3.0.3
info:
  title: Schedules API
  version: 1.0.0
  description: API for managing medical schedules
  contact:
    name: Carlos Eduardo Rincon Junior
    email: carlos.rincon.junior@aluno.ifsp.edu.br
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/
    description: Local server

tags:
  - name: Schedules
    description: Operations related to medical schedules

paths:
  /schedule:
    get:
      tags:
        - Schedules
      summary: List all schedules
      operationId: listSchedules
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 0
            example: 1
        - name: perPage
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        "200":
          description: A list of schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSchedules"

    post:
      tags:
        - Schedules
      summary: Create a new schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchedule"
      responses:
        "201":
          description: Schedule created
          headers:
            Location:
              schema:
                type: string
                format: uri
                example: /schedule/123e4567-e89b-12d3-a456-426614174000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"

  /schedule/{scheduleId}:
    get:
      tags:
        - Schedules
      summary: Get a schedule by ID
      operationId: getSchedule
      parameters:
        - name: scheduleId
          in: path
          description: ID of the schedule to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Bad request
        "404":
          description: Schedule not found

    put:
      tags:
        - Schedules
      summary: Update a schedule
      operationId: updateSchedule
      parameters:
        - name: scheduleId
          in: path
          description: ID of the schedule to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchedule"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Schedule not found

    delete:
      tags:
        - Schedules
      summary: Delete a schedule
      operationId: deleteSchedule
      parameters:
        - name: scheduleId
          in: path
          description: ID of the schedule to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Schedule deleted
        "400":
          description: Bad request

components:
  schemas:
    CreateSchedule:
      required:
        - doctorId
        - patientId
        - scheduleDate
        - scheduleHour
      type: object
      properties:
        doctorId:
          type: integer
          format: int64
          description: ID of the doctor
          example: 3
        patientId:
          type: integer
          format: int64
          description: ID of the patient
          example: 7
        scheduleDate:
          type: string
          format: date
          description: Date of the schedule
          example: 2025-08-10
        scheduleHour:
          type: string
          format: time
          description: Hour of the schedule
          example: "14:30"
        observation:
          type: string
          description: Optional observation about the appointment
          maxLength: 500
          example: Patient requested afternoon appointment

    UpdateSchedule:
      type: object
      properties:
        scheduleDate:
          type: string
          format: date
          description: Date of the schedule
          example: 2025-08-11
        scheduleHour:
          type: string
          format: time
          description: Hour of the schedule
          example: "16:00"
        observation:
          type: string
          description: Optional observation
          maxLength: 500
          example: Rescheduled due to doctor's request
        status:
          type: string
          description: Status of the schedule
          example: CANCELADA

    PaginatedSchedules:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 42
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"

    Schedule:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID of the schedule
          example: 15
        doctorId:
          type: integer
          format: int64
          description: ID of the doctor
          example: 3
        patientId:
          type: integer
          format: int64
          description: ID of the patient
          example: 7
        scheduleDate:
          type: string
          format: date
          description: Date of the schedule
          example: 2025-08-10
        scheduleHour:
          type: string
          format: time
          description: Hour of the schedule
          example: "14:30"
        observation:
          type: string
          description: Optional observation
          maxLength: 500
          example: Return consultation
        status:
          type: string
          description: Status of the schedule
          example: SCHEDULE

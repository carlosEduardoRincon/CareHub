openapi: 3.0.3
info:
  title: Patients API
  version: 1.0.0
  description: API for managing hospital patients
  contact:
    name: Carlos Eduardo Rincon Junior
    email: carlos.rincon.junior@aluno.ifsp.edu.br
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/
    description: Local server
tags:
  - name: Patients
    description: Operations related to restaurant patients
paths:
  /patients:
    get:
      tags:
        - Patients
      summary: List all patients
      operationId: listPatients
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 0
            example: 1
        - name: perPage
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        "200":
          description: A list of patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPatients"
    post:
      tags:
        - Patients
      summary: Create a new patient
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatient"
      responses:
        "201":
          description: Patient created
          headers:
            Location:
              schema:
                type: string
                format: uri
                example: /patient/123e4567-e89b-12d3-a456-426614174000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
  /patients/{patientId}:
    get:
      tags:
        - Patients
      summary: Get a patient by ID
      operationId: getPatient
      parameters:
        - name: patientId
          in: path
          description: ID of the patient to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Patient found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Bad request
        "404":
          description: Patient not found
    put:
      tags:
        - Patients
      summary: Update a patient
      operationId: updatePatient
      parameters:
        - name: patientId
          in: path
          description: ID of the patient to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatient"
      responses:
        "200":
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
    delete:
      tags:
        - Patients
      summary: Delete a patient
      operationId: deletePatient
      parameters:
        - name: patientId
          in: path
          description: ID of the patient to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Patient deleted
        "400":
          description: Bad request
components:
  schemas:
    CreatePatient:
      required:
        - name
        - email
        - address
        - birthDate
        - telephone
      type: object
      properties:
        name:
          type: string
          description: Name of the patient
          minLength: 5
          maxLength: 100
          example: Carlos
        email:
          type: string
          format: email
          description: E-mail of the patient
          minLength: 5
          maxLength: 50
          example: example@email.com.br
        address:
          type: string
          description: Address of the patient
          minLength: 5
          maxLength: 255
          example: Av Street, 12
        birthDate:
          type: string
          format: date
          description: Birthdate of the patient
          example: 2025-07-17
        telephone:
          type: string
          description: Telephone of the patient
          minLength: 14
          maxLength: 30
          example: (11) 12342-1234
    UpdatePatient:
      type: object
      properties:
        name:
          type: string
          description: Name of the patient
          minLength: 5
          maxLength: 100
          example: Carlos
        email:
          type: string
          format: email
          description: E-mail of the patient
          minLength: 5
          maxLength: 50
          example: example@email.com.br
        address:
          type: string
          description: Address of the patient
          minLength: 5
          maxLength: 255
          example: Av Street, 12
        telephone:
          type: string
          description: Telephone of the patient
          minLength: 14
          maxLength: 30
          example: (11) 12342-1234
    PaginatedPatients:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 100
        items:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
    Patient:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Id of the patient
          maxLength: 10
          example: 15
        name:
          type: string
          description: Name of the patient
          minLength: 5
          maxLength: 100
          example: Carlos
        email:
          type: string
          format: email
          description: E-mail of the patient
          minLength: 5
          maxLength: 50
          example: example@email.com.br
        address:
          type: string
          description: Address of the patient
          minLength: 5
          maxLength: 255
          example: Av Street, 12
        birthDate:
          type: string
          format: date
          description: Birthdate of the patient
          example: 2025-07-17
        password:
          type: string
          description: Generated password of the patient
          minLength: 5
          maxLength: 30
          example: strongPassword123
        telephone:
          type: string
          description: Telephone of the patient
          minLength: 14
          maxLength: 30
          example: (11) 12342-1234
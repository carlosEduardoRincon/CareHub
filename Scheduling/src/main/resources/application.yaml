spring:
  profiles:
    active: local
  application:
    name: CareHub
  datasource:
    url: jdbc:postgresql://carehub_db:5432/carehub
    username: carehub
    password: carehub123
    default-schema: carehub
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      continue-on-error: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: care-hub-scheduling-producer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        batch.size: 32768
        spring.json.add.type.headers: false
    driver-class-name: org.postgresql.Driver

logging:
  level:
    org:
      flywaydb: DEBUG
      springframework:
  swagger-ui:
    url: /api/patients.yaml

api:
  security:
    token:
      secret: ${JWT_SECRET:carlosEduardoRinconJunior}
